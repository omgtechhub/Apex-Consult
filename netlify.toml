# Netlify deployment configuration — Altivance
# ---------------------------------------------------------------------------
# Next.js is supported natively on Netlify via the OpenNext adapter, which is
# installed and upgraded automatically. The adapter is deliberately NOT pinned
# here with a [[plugins]] block: Netlify's own guidance is to let it
# auto-upgrade so Next.js fixes arrive without a manual bump.
#
# `publish` must match `distDir` in next.config.ts, which defaults to `.next`.
# Do NOT set NEXT_DIST_DIR in the Netlify UI — that variable exists only so a
# local preview build can avoid clobbering a running dev server's `.next`.
# Setting it here would make Netlify publish a directory it never built into.
# ---------------------------------------------------------------------------

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next.js 16 requires Node >= 20.9. Pinned so a change to Netlify's default
  # image cannot silently alter the runtime under a live payments site.
  NODE_VERSION = "22"
